backend:
  name: git-gateway
  branch: main

# After Netlify Identity + Git Gateway are enabled (see setup guide),
# this panel lets an invited person log in and edit the site's text
# without touching any code.

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:

  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home Page Content"
        file: "content/home.json"
