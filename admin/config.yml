          - { label: "\"Today\" item 2 — heading", name: "today-2-heading", widget: "string" }
          - { label: "\"Today\" item 2 — text", name: "today-2-text", widget: "string" }
          - { label: "\"Today\" item 3 — heading", name: "today-3-heading", widget: "string" }
          - { label: "\"Today\" item 3 — text", name: "today-3-text", widget: "string" }

